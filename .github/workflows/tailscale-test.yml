
name: Test Tailscale connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.104.196.51

      - name: Test SSH access
        run: |
          nc -zvw5 100.104.196.51 22

      - name: Verify PostgreSQL is not accessible
        run: |
          if nc -zvw5 100.104.196.51 5432; then
            echo "ERROR: PostgreSQL should not be accessible!"
            exit 1
          else
            echo "Good: PostgreSQL is not accessible."
          fi
