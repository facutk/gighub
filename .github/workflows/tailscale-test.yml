
name: Test Tailscale connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.104.196.51

      - name: Test SSH access
        run: |
          nc -zvw5 100.104.196.51 22

      - name: Verify PostgreSQL is not accessible
        run: |
          if nc -zvw5 100.104.196.51 5432; then
            echo "ERROR: PostgreSQL should not be accessible!"
            exit 1
          else
            echo "Good: PostgreSQL is not accessible."
          fi


      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gighub_deploy
          chmod 600 ~/.ssh/gighub_deploy
          ssh-keyscan -H 100.104.196.51 >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          ssh -i ~/.ssh/gighub_deploy \
            -o IdentitiesOnly=yes \
            debian@100.104.196.51 \
            'hostname && whoami && docker ps'
